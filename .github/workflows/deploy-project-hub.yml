name: Deploy Project Hub

on:
  push:
    branches:
      - main
    paths:
      - index.php
      - frontend/css/home.css
      - frontend/js/home.js
      - frontend/assets/matrix-city-v2.webp
      - api-client.php
      - login.php
      - login-processa.php
      - pet/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-project-hub
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar menu de projetos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://lemesolucoesemti.com.br/

    steps:
      - name: Baixar versao aprovada
        uses: actions/checkout@v6

      - name: Detectar publicacao FTPS
        id: ftps
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$FTP_SERVER" && -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FTPS nao configurado; aguardando o deploy Git da Hostinger."
          fi

      - name: Preparar cliente FTPS
        if: steps.ftps.outputs.configured == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Publicar aplicacao e dashboard
        if: steps.ftps.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_TLS_HOST: srv1543.hstgr.io
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail

          printf '%s %s\n' "$FTP_SERVER" "$FTP_TLS_HOST" |
            sudo tee -a /etc/hosts >/dev/null

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_TLS_HOST" <<'LFTP_COMMANDS'
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 30
          mkdir -p frontend/css
          mkdir -p frontend/js
          mkdir -p frontend/assets
          mkdir -p pet/api
          mkdir -p pet/frontend/css
          mkdir -p pet/frontend/js
          mkdir -p pet/includes
          put -O / index.php
          put -O / api-client.php
          put -O / login.php
          put -O / login-processa.php
          put -O /frontend/css frontend/css/home.css
          put -O /frontend/js frontend/js/home.js
          put -O /frontend/assets frontend/assets/matrix-city-v2.webp
          put -O /pet pet/index.php
          put -O /pet pet/callback.php
          put -O /pet pet/logout.php
          put -O /pet pet/.htaccess
          put -O /pet/api pet/api/dashboard.php
          put -O /pet/frontend/css pet/frontend/css/app.css
          put -O /pet/frontend/js pet/frontend/js/app.js
          put -O /pet/includes pet/includes/session.php
          put -O /pet/includes pet/includes/client.php
          bye
          LFTP_COMMANDS

      - name: Verificar pagina publicada
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail --max-time 30 \
              https://lemesolucoesemti.com.br/ -o page.html && \
              grep -q "Todos os projetos Leme" page.html && \
              curl --silent --show-error --fail --max-time 30 \
                https://lemesolucoesemti.com.br/pet/frontend/css/app.css -o pet.css && \
              grep -q -- "--green: #1f765d" pet.css && \
              curl --silent --show-error --head --max-time 30 \
                https://lemesolucoesemti.com.br/pet/ -o pet.headers && \
              grep -qi "location: https://lemeinformatica.com.br/pet/sso-start.php" pet.headers; then
              exit 0
            fi
            sleep 5
          done
          exit 1
