name: Project Hub CI

on:
  push:
    branches:
      - main
      - feat/project-hub-menu
      - "feat/pet-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validar menu de projetos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: none

      - name: Lint PHP
        shell: bash
        run: find . -type f -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript
        run: |
          node --check app.js
          node --check frontend/js/home.js
          node --check frontend/js/powerbi.js
          node --check pet/frontend/js/app.js

      - name: Check Pet dashboard contracts
        shell: bash
        run: |
          test -s pet/index.php
          test -s pet/api/dashboard.php
          test -s pet/frontend/css/app.css
          grep -q "relatorios.php" pet/api/dashboard.php
          grep -q "Dashboard Pet" pet/index.php
          grep -q "sso-start.php" pet/index.php
          test -s pet/callback.php
          test -s pet/includes/session.php
          test -s pet/includes/client.php

      - name: Check project hub links
        shell: bash
        run: |
          test "$(tr -d '\r\n' < PROJECT_HUB_VERSION)" = "1.3.0"
          grep -q "https://lemeinformatica.com.br/pet/" index.php
          grep -q "https://lemesolucoesemti.com.br/pet/" index.php
          grep -q "https://lemesolucoesemti.com.br/powerbi/" index.php
          grep -q "https://lemeinformatica.com.br/gov/" index.php
          grep -q "https://lemesolucoesemti.com.br/gov/" index.php
          grep -q "https://lemesolucoesemti.com.br/invest/" index.php
          grep -q "https://lemesolucoesemti.com.br/cloud/" index.php
          grep -q "https://lemeinformatica.com.br/login.php" index.php

      - name: Check restored project contracts
        shell: bash
        run: |
          test -s cloud/index.php
          test -s cloud/styles.css
          grep -q "Location: /nextcloud/" cloud/index.php
          test -s gov/index.php
          test -s gov/licitacoes.php
          test -s gov/private/runtime.php
          test ! -e gov/private/config.php
          test -s invest/index.php
          test -s invest/painel.php
          test -s invest/.htaccess
          test -s powerbi/index.php
          test -s powerbi/dados.php
          test -s api/alimentos.php
          test -s api/usuarios-sync.php
          test -s auth/nextcloud-client.php
          test -s sql/create_user_integration.sql
          grep -q "main_api_request" api/usuarios.php
          grep -q "OCS-APIRequest: true" auth/nextcloud-client.php
          grep -q "sso-start.php?next=powerbi" powerbi/index.php
          grep -q "dataset=alimentos" frontend/js/powerbi.js
          grep -q "LEME_SSO_DASHBOARD" pet/includes/session.php
          grep -q "ApiKeyLeme" powerbi/consulta-powerbi.m
          if grep -Eq '[a-f0-9]{48,}' powerbi/consulta-powerbi.m; then
            echo "Power BI query contains a hard-coded key."
            exit 1
          fi

      - name: Check assets
        shell: bash
        run: |
          test -s frontend/css/home.css
          test -s frontend/js/home.js
          test -s frontend/assets/matrix-city-v2.webp
          test -s frontend/css/powerbi.css
          test -s frontend/js/powerbi.js

      - name: Reject runtime secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(config\.php|database\.runtime\.php|\.env)$'; then
            echo "Runtime secret file is tracked."
            exit 1
          fi
          if git grep -nE '[A-Fa-f0-9]{48,}'; then
            echo "Possible long-form secret is tracked."
            exit 1
          fi
